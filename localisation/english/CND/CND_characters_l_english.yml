l_english:
 CND_bonnibel_bubblegum:0 "Princess Bonnibel Bubblegum"
 CND_bonnibel_bubblegum_desc:0 "Princess Bonnibel Bubblegum is the ruler of the Candy Kingdom, a land comprised (as the name suggests) of candy. As the sovereign leader of the Candy Kingdom, it is her duty to safeguard the safety and security of her Candy Citizens, from the Candy Mountains down to the Grasslands, for she will do absolutely everything to achieve that goal, no matter the cost."