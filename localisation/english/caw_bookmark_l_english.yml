l_english:
 COME_ALONG_WITH_WAR_NAME:0 "Come Along With War"
 COME_ALONG_WITH_WAR_DESC:0 "January 1, 1004 AMW.\n\nA thousand years after the Mushroom War, the Land of Ooo has barely recovered from the Elemental crisis. Finn and Jake are back from the human islands, and Lumpy Space Princess's reset wave has restored the kingdoms to normal—mostly. Unfortunately, it also woke up Princess Bubblegum's scheming Uncle Gumbald. Out in the northwestern plains, Gumbaldia's smokestacks are already blackening the sky. Peaceful days in the Grasslands are running out."

 WAR_FOR_OOO_NAME:0 "The War for Ooo"
 WAR_FOR_OOO_DESC:0 "Mid-1011 AMW.\n\nFive years of war have left Ooo's kingdoms battered and exhausted, and none of it matters anymore. High above the Grasslands, the sky has split open. Driven to desperation to save Simon Petrikov, Betty Grof's Martian ritual has pulled GOLB into the world. Old grudges have to wait: either the surviving kingdoms hold the line together, or everything gets digested into nothing."

 CND_COME_ALONG_WITH_WAR_DESC:0 "For eight hundred years, Princess Bonnibel Bubblegum has kept the Candy Kingdom safe through science, high walls, and strict oversight. On the surface, life in Candy City is still one big festival, but the kingdom is poorly prepared for what lies ahead. The Banana Guards are undisciplined, opposition factions are stirring in the taverns, and out west, Bonnie's newly returned Uncle Gumbald is already building an industrial army to settle an eight-century grudge."

 GMB_COME_ALONG_WITH_WAR_DESC:0 "Uncle Gumbald spent eight hundred years trapped as a simple-minded punch bowl after his own niece betrayed him. Now, thanks to Lumpy Space Princess's elemental reset wave, Gumbald, Aunt Lolly, and Cousin Chicle have their minds back, and Gumbald is out for blood. In the northwestern plains, he has raised the industrial city of Gumbaldia almost overnight. The factories are running twenty-four hours a day, the chemical vats in Lollyville are full, and every old enemy of the Candy Kingdom is being paid to join his army. Bonnibel stole his dream once. He won't give her a second chance."

 VRT_COME_ALONG_WITH_WAR_DESC:0 "What started as late-night conspiracy talk on Starchy's radio and angry apple farmers tired of royal permits has grown into a real revolution. In the western forests, the Veritas Brigade and local farmhands have kicked out the Banana Guards and set up Ooo's first workers' republic. Still, freedom is shaky. Starchy sees Princess Bubblegum's spies hiding in the alleys, Tree Trunks wants to spread the revolution to every kitchen in Ooo, and at home, her giant adopted son Sweet P is starting to hear dark whispers in his sleep."

 NUT_COME_ALONG_WITH_WAR_DESC:0 "Life in the Duchy of Nuts is simple: host grand balls, keep the nut mills turning, and never run out of Royal Pudding. As a loyal vassal of the Candy Kingdom, the Duke of Nuts leaves the hard work of taxes and border defense to Princess Bubblegum's clerks while he tends to his secret pudding habit. With Gumbaldia arming for war, however, the quiet days are ending. Soon the Duchy will have to decide whether to march for Bubblegum, listen to the Duchess's ambitions, or just lock the castle gates."

 LEM_COME_ALONG_WITH_WAR_DESC:0 "The dark days of famine and shock-collars in Castle Lemongrab are over... mostly. Ever since Princess Bubblegum stitched the two shattered Earls together into a new Lemongrab, the citadel has settled into a strange, quiet routine. The Earl no longer screams for conquest, preferring strict schedules and total isolation behind his mountain walls. Yet with Uncle Gumbald building an army right on his doorstep and Bubblegum demanding loyalty, Lemongrab is being dragged back into family politics whether he finds it acceptable or not."