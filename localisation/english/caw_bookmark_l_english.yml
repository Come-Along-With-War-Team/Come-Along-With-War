l_english:
 COME_ALONG_WITH_WAR_NAME:0 "Come Along With War"
 COME_ALONG_WITH_WAR_DESC:0 "January 1, 1004 AMW.\n\nA thousand years after the Mushroom War, the Land of Ooo has barely recovered from the Elemental crisis. Finn and Jake are back from the human islands, and Lumpy Space Princess's reset wave has restored the kingdoms to normal—mostly. Unfortunately, it also woke up Princess Bubblegum's scheming Uncle Gumbald. Out in the northwestern plains, Gumbaldia's smokestacks are already blackening the sky. Peaceful days in the Grasslands are running out."

 WAR_FOR_OOO_NAME:0 "The War for Ooo"
 WAR_FOR_OOO_DESC:0 "Mid-1011 AMW.\n\nFive years of war have left Ooo's kingdoms battered and exhausted, and none of it matters anymore. High above the Grasslands, the sky has split open. Driven to desperation to save Simon Petrikov, Betty Grof's Martian ritual has pulled GOLB into the world. Old grudges have to wait: either the surviving kingdoms hold the line together, or everything gets digested into nothing."

 CND_COME_ALONG_WITH_WAR_DESC:0 "For eight hundred years, Princess Bonnibel Bubblegum has kept the Candy Kingdom safe through science, high walls, and strict oversight. On the surface, life in Candy City is still one big festival, but the kingdom is poorly prepared for what lies ahead. The Banana Guards are undisciplined, opposition factions are stirring in the taverns, and out west, Bonnie's newly returned Uncle Gumbald is already building an industrial army to settle an eight-century grudge."