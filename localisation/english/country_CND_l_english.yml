# IDEAS

 CND_the_monitor_room:0 "The Monitor Room"
 CND_the_monitor_room_desc:0 "Despite the loud protests from Flame Princess, thousands of hidden cameras are still wired into every citizen's household, feeding straight to a locked basement under the castle. Most of the screens are supposed to be turned off, but the Princess still keeps a quiet eye on everyone... just in case."

 CND_thin_yellow_line:0 "The Thin Yellow Line"
 CND_thin_yellow_line_desc:0 "For centuries, the towering Gumball Guardians have protected the Candy Kingdom, providing its only "serious" manpower. However, with Gumbald's industrial army building up in the north, the kingdom faces a new found threat. The Banana Guards are loyal, but they are completely unprepared for a real war. Giving them rifles won't solve the problem overnight. The entire guard corps needs to be disciplined before they can face a real army."

 CND_a_house_divided:0 "A House Divided"
 CND_a_house_divided_desc:0 "The Candy People aren't as unquestioning as they used to be. Between labor unions grumbling in the Candy factories, lingering royalist con-men, and Gumbaldian spies slipping through the castle walls, the Crown's grip on the kingdom is starting to slip."

 CND_sugar_and_circuses:0 "Sugar and Circuses"
 CND_sugar_and_circuses_desc:0 "Because Candy People explode when they get too scared, Princess Bubblegum had to keep the public calm with non-stop street festivals, and entertainment. It keeps everyone smiling, but it ties up huge amounts of sugar and factory space that should've gone to making weapons."