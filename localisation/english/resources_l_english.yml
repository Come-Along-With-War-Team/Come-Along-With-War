l_english:
 rubber:0 "Candy"
 rubber_desc:0 "Harvested spun sugar and stretchy saps. If boiled down to the right consistency, it makes surprisingly tough truck tires, airframe seals, and shock-absorbing gaskets."

 steel:0 "Steel"
 steel_desc:0 "Rusted hardware, subway rails, and smelted fresh pig-iron. Whether you're forging a broadsword or riveting a tank hull together, nothing beats good old-fashioned metal."

 chromium:0 "Pre-War Tech"
 chromium_desc:0 "Working circuit boards, vacuum tubes, and intact wiring dug out of junkyards. Most folks have no idea how the ancients built this stuff, but you can't run a radar tower or a Gumball Guardian without it."

 tungsten:0 "Crystals"
 tungsten_desc:0 "Dense gem clusters quarried out from the mines. They're hard enough to punch through tank armor and hold enough ambient magic for laser cannons and artilleries."

 aluminium:0 "MO Alloys"
 aluminium_desc:0 "Feather-light stamped sheet metal originally cooked up by Moe. It bends without snapping and never rusts, making it the gold standard for planes, armored vehicles and many more."

 oil:0 "Biodiesel"
 oil_desc:0 "A smelly, high-octane brew of fermented apple-ethanol, lard excrements, and used deep-fryer grease. Keep it away from open flames unless it's already inside a tank engine."

 coal:0 "Coal"
 coal_desc:0 "High-grade anthracite, volcanic charcoal, and compacted peat dug out of Ooo's deep quarries. Burned in factory boilers and steam turbines to generate the electrical power needed to keep assembly lines running."

