 CND_bonnibel_bubblegum:0 "Принцесса Боннибель Бубльгум"
 CND_bonnibel_bubblegum_desc:0 "Принцесса Боннибель Бубльгум - правительница Конфетного королевства, страны, состоящей (как следует из названия) из конфет. Как полноправный правитель Конфетного королевства, она обязана обеспечивать безопасность своих подданных, от Леденцовых гор до Лугов, и она сделает абсолютно всё для достижения этой цели, чего бы ей это ни стоило."