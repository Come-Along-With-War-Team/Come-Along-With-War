# IDEAS

 CND_the_monitor_room:0 "Тотальная слежка"
 CND_the_monitor_room_desc:0 "Несмотря на громкие протесты Огне-принцессы, тысячи скрытых камер по-прежнему установлены в домах каждого горожанина и ведут прямую трансляцию в запертый подвал под замком. Предполагается, что большинство экранов выключено, но принцесса по-прежнему незаметно следит за всеми... на всякий случай."

 CND_thin_yellow_line:0 "Банано-хлам"
 CND_thin_yellow_line_desc:0 "На протяжении веков бананогвардия уверенной стеной стояла на защите Конфетного королевства, предоставляя из себя единственную "серьезную" опору государства. Однако с появлением на севере промышленно развитой армии Гумбальда королевство столкнулось с новой угрозой. Банановая стража лояльна, но она совершенно не готова к настоящей войне. Выдача им винтовок не решит проблему в одночасье. Весь корпус гвардии должен быть обучен и подготовлен, прежде чем сможет столкнуться с настоящей армией... И выжить."

 CND_a_house_divided:0 "Крах конфетного единства"
 CND_a_house_divided_desc:0 "Продавцы конфет уже не такие беспрекословные, как раньше. Из-за недовольства профсоюзов на кондитерских фабриках, засидевшихся мошенников-роялистов и гамбальдийских шпионов, проникающих за стены замков, власть короны над королевством начинает ослабевать."

 CND_sugar_and_circuses:0 "Сахар на нужды народа"
 CND_sugar_and_circuses_desc:0 "Поскольку конфетный народ буквально взрывается, когда ему становится слишком страшно, принцессе Жвачке приходилось поддерживать всеобщее спокойствее с помощью непрерывных уличных фестивалей и вечеринок. Это заставляет всех улыбаться, но отнимает огромное количество сахара и производственных площадей, которые следовало бы использовать для производства оружия."