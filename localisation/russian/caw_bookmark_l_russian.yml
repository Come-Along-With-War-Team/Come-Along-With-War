l_russian:
 COME_ALONG_WITH_WAR_NAME:0 "Мы пойдём с тобой, мотыльками и войной"
 COME_ALONG_WITH_WAR_DESC:0 "\nЯнварь 1, 1000 ПГВ.\n\nТысячу лет спустя после Грибной войны (ПГВ) Земля ООО едва оправилась от Стихийного кризиса. Финн и Джейк вернулись с островов людей, а волна перезагрузки принцессы пупырки вернула королевства к нормальной жизни... ну, в основном. К сожалению, это также пробудило коварного дядю принцессы Бубльгум, Гумбальда. На северо-западных равнинах небо над армией Гумбалдии уже чернеет, и мирные дни ООО подходят к концу."

 WAR_FOR_OOO_NAME:0 "Война в ООО"
 WAR_FOR_OOO_DESC:0 "Середина-1011 ПГВ.\n\nПять лет войны оставили королевства ООО разбитыми и истощенными, и всё это больше не имеет значения. Высоко над Лугами разверзлось небо. Доведенная до отчаяния желанием спасти Саймона Петрикова, Бетти Гроф марсианским ритуалом привела Голба в этот мир. Старым обидам придется подождать: либо выжившие королевства будут держаться вместе, либо все обратятся в прах."

 CND_COME_ALONG_WITH_WAR_DESC:0 "На протяжении восьмисот лет принцесса Боннибель Бубльгум строго следила за безопасностью в Конфетном королевстве. На первый взгляд жизнь в столице королевства по-прежнему представляет собой одну большую вечеринку с ночевкой, но королевство содрогается от мысли о том, что ждет его впереди. Бананогвардия недисциплинирована, внутри стен замка бушуют оппозиционные группировки, а на севере недавно вернувшийся дядя Бонни Гумбальд уже создает промышленную армию, чтобы уладить восьмивековую вражду."

 GMB_COME_ALONG_WITH_WAR_DESC:0 "Дядя Гумбальд провел восемьсот лет в ловушке в виде простодушной чаши для пунша после того, как его предала собственная племянница. Теперь, благодаря волне элементарной перезагрузки принцессы пупырчатого королевтсва, к Гумбальду, тете Лолли и кузену Чиклу вернулся разум, и Гумбальд жаждет крови. На севере он почти за одну ночь возвёл промышленный город Гумбалдия. Фабрики работают двадцать четыре часа в сутки, резервуары с химикатами в Лолливилле полны, и каждому старому врагу Конфетного королевства щедро заплатят за то, чтобы он вступил в его армию. Боннибел однажды украла его мечту. Второго шанса он ей не даст."

 VRT_COME_ALONG_WITH_WAR_DESC:0 "То, что началось с ночных разговоров о заговоре на радио Старчи и собрания разгневанных жителей Кэнди в секретном месте, переросло в настоящую революцию. В западных лесах бригада "Веритас" и местные батраки выгнали банановых охранников и основали первую рабочую республику Ооо. Тем не менее, свобода шатка. Старчи видит, что шпионы принцессы Бабблгум прячутся в переулках, Tree Trunks хочет распространить революцию на все кухни в Ооо, а дома ее приемный сын-гигант Свит Пи начинает слышать во сне зловещий шепот."

 NUT_COME_ALONG_WITH_WAR_DESC:0 "Как верный вассал Конфетного королевства, герцог Орехов выполняет тяжелую работу по сбору налогов и охране границ королевства конфет, а сам занимается своим тайным приготовлением пудинга. Однако, когда Гумбальдия готовится к войне, спокойные дни заканчиваются. Вскоре герцогству придется решать, выступать ли за принцессу Живачку, прислушаться к амбициям герцогини или вовсе запереть ворота замка."

 LEM_COME_ALONG_WITH_WAR_DESC:0 "Мрачные дни голода и шоковых ошейников в замке Лимонохвата закончились... по большей части. С тех пор как принцесса Бубльгум сшила из двух разорвавшихся графов нового Лимонохвата, в цитадели установилась странная, но такая тихая жизнь. Граф больше не жаждет завоеваний, предпочитая строгий распорядок дня и полную изоляцию за стенами своих гор. И все же, поскольку дядя Гумбальд собирает армию прямо у своего порога, а Жвачка требует лояльности, Лимонохвата снова втягивают в семейную политику, независимо от того, считает он это приемлемым или нет."