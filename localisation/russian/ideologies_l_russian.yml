 # =========================
 # RATIONALISM SUB-IDEOLOGIES
 # =========================
 bonnibelianism:0 "Боннибелианизм"
 bonnibelianism_desc:0 "Боннибелианизм — это система доброжелательного научного абсолютизма, построенная вокруг Принцессы Жвачки. Поскольку Конфетные люди были созданы мягкими и легко пугающимися, государство действует как гиперопекающий родитель, устраивая постоянные фестивали и обеспечивая общественную заботу, тайно устроняя любые угрозы своему режиму."
 ducal_feudalism:0 "Ореховый феодализм"
 ducal_feudalism_desc:0 "Ореховый феодализм. Знать старого мира редко выживает в современную эпоху самостоятельно, поэтому самые умные герцоги и мелкие члены королевских семей просто подписывают контракт с более крупной короной. При герцогском феодализме местные лорды сохраняют свои замки, бархатные плащи и вальсы в бальных залах, в то время как обученные писцы из столицы их сюзерена занимаются налогами, дорогами и пограничной стражей. Это удобная договоренность для всех при дворе. Пока королевство остается тихим, а королевские поставки пудинга прибывают вовремя, знать не имеет ничего против власти ученых и бюрократов."


 # =========================
 # SUPREMACIST SUB-IDEOLOGIES
 # =========================
 national_confectionism:0 "Национальный конфекционизм"
 national_confectionism_desc:0 "Национальный конфекционизм — это авторитарная, промышленно-ориентированная идеология дяди Гумбольда. Его последователи верят, что все создания Материнской Жвачки должны быть объединены централизованным государством, и что Принцесса Жвачка потратила восемьсот лет впустую, относясь к королевству как к детской площадке, а не как к сверхдержаве."


 # =========================
 # COLLECTIVISM SUB-IDEOLOGIES
 # =========================
 starchism:0 "Старчизм"
 starchism_desc:0 "Старчизм — это политическая философия Старчи (отнюдь не старческий маразм), основателя Веритасской бригады. Рожденные из ночных радиопередач «Ночной смены» и тайных встреч под Конфетным королевством перед Кондитерской революцией, стархисты верят, что социалистическое движение может выжить только под строгой защитой авангардной партии. Окруженная внешними угрозами, такими как фашистский режим Принцессы Жвачки, революция не может позволить себе расслабиться. Принцессы не правят по божественному праву, ибо власть принадлежит народу, осуществляется народом и для народа, даже если Старчи придется прослушивать каждую телефонную линию в городе, чтобы всё так и оставалось."
 trunkism:0 "Яблокизм"
 trunkism_desc:0 "Яблокизм. Названный в честь дела всей жизни матриарха Яблочных Садов, движение Деревяшки — это социализм фермеров, пекарей и фабричных рабочих местного разлива, которые хотят выгнать коронованных правителей из своих кухонь и желают, чтобы каждая страна в ООО вкусила той же свободы. Почему принцесса в замке должна решать, кто получит разрешение на брак, кому принадлежат деревья или как семья воспитывает своего ребенка? В отличие от параноидального «социализма в отдельно взятой стране» Старчи, яблочники верят, что революция не может оставаться за забором садов. Пока не свергнут каждый королевский трон и поеп каждый рабочий во всём УУУ не получит место за столом и теплый кусок яблочного пирога, ни одна коммуна не в безопасности."

 # =========================
 # TRADITIONALISM SUB-IDEOLOGIES
 # =========================
 despotism:0 "Деспотизм"
 despotism_desc:0 "Деспотизм. Не каждый самодержавец хочет завоевать мир или перестроить общество с нуля. Деспотизм — это правление абсолютного правителя, который просто хочет, чтобы в королевстве царил мир, соблюдались правила и никто не посягал на власть. Здесь нет грандиозных идеологических крестовых походов. Только строгие законы, тяжелые замковые ворота и диктатор, олицетворяющий собой государство. Жизнь за стенами государства может быть настолько непредсказуемой и суровой, что после многих лет хаоса даже сварливый, ворчливый диктатор, поддерживающий мир, будет казаться лучшим правителем."