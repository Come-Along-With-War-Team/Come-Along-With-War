l_russian:
 LOADING_TIP_0:0 "Мы вместе выступаем против твоей тирании. Твоя тюрьма может удержать одного из нас, но ей не удержать всех.\n- Деревяшка"
 LOADING_TIP_1:0 "Тебя ждёт одна лишь тьма, а твой народ — лишь смерть.\n- Лич"
 LOADING_TIP_2:0 "За Королевство!\n- Полковник Сладкая Кукуруза"
 LOADING_TIP_3:0 "Монархии — это не демократии!\n- Принцесса Жвачка" 
 LOADING_TIP_4:0 "Чек, пожалуйста!\n- Шелби червяк"
 LOADING_TIP_5:0 "В темницу на миллион лет!\n- Граф Лимоноват"
 LOADING_TIP_6:0 "Я хожу свиньёй.\n- Финн Мертенс"
 LOADING_TIP_7:0 "Я рад, что до того, как я сыграю в ящик, будет ещё одна настоящая война. Перебить их всех!\n- Полковник Сладкая Кукуруза"
 LOADING_TIP_8:0 "До того, как появилось время, до того, как появилось хоть что-то, не было ничего. И до того, как не стало ничего... были монстры.\n- Лич" 
 LOADING_TIP_9:0 "Всё остаётся там, где ты это оставил. Всё остаётся, но всё же меняется, пусть и совсем чуть-чуть.\n- Марселин, Королева Вампиров"