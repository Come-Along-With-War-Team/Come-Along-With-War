l_russian:
 rubber:0 "Сласть"
 rubber_desc:0 "Сахарная пудра, эластичный ирисный сок и густой фруктовый пектин, собранные в форме для выпечки конфет. Доведенная до нужной консистенции, она делает удивительно прочные шины для грузовиков, уплотнения для корпуса самолета и амортизирующие прокладки."

 steel:0 "Сталь"
 steel_desc:0 "Ржавые балки шоссейных дорог, рельсы метро и свежий чугун, выплавленный в жерлах вулканов. Куете ли вы палаш или склепываете корпус танка - неважно. Ничто не сравнится со старым добрым металлом."

 chromium:0 "Довоенщина"
 chromium_desc:0 "Рабочие печатные платы, вакуумные трубки и неповрежденная проводка, найденные в Бьютопии, на Острове основателей и на свалке ООО. Большинство людей понятия не имеют, как древние строили все это, но без этого вы не сможете управлять радарной вышкой или Стражами Гумбальда."

 tungsten:0 "Кристаллы"
 tungsten_desc:0 "Плотные, жужжащие россыпи драгоценных камней, добытых на горе Крагдор и в восточных хрустальных разломах. Они достаточно прочны, чтобы пробить танковую броню, и содержат достаточно внешней магии, чтобы сфокусировать лазерные пушки и звуковую артиллерию."

 aluminium:0 "Мо-сплавы"
 aluminium_desc:0 "Легкий, как перышко, штампованный листовой металл, первоначально изготовленный компанией Mo на заводе Mо в Бэдленде. Изгибы, ржавчина - ему всёни по чём, что делает его золотым стандартом для крыльев бипланов, ультрамобилей и корпусов роботов."

 oil:0 "Биотопливо"
 oil_desc:0 "Ароматный, высокооктановый напиток из сброженного яблочного спирта, сырого масла южных морей и жира от фритюрницы из Королевства Завтрака. Держите это подальше от открытого огня, если только вам не нужно заправить свою ласточку."

 coal:0 "Уголь"
 coal_desc:0 "Высококачественный антрацит, вулканический уголь из Огненного царства и прессованный торф, добываемый в глубоких карьерах ООО. Сжигается в заводских котлах и паровых турбинах для выработки электроэнергии, необходимой для поддержания работы сборочных линий."

 # Trade Window Tooltips
 PRODUCTION_RESOURCE_SHORTAGE:0 "Недостаток $RESOURCE|H$ приводит к производственным сбоям."
